<figure class="diagram" id="diagram-team" aria-labelledby="diagram-team-title"><div class="diagram-head"><div><span class="diagram-eyebrow">00 / MEET THE TEAM</span><h3 id="diagram-team-title">Meet the team before exploring the folders</h3></div><p class="diagram-note">Boxes are roles; arrows are calls. These names appear throughout the tutorial and match the names you can search for in the code.</p></div>
<div class="diagram-map team-map" data-edges="client:env,env:resources,env:agent,agent:model,resources:sandbox,agent:sandbox,model:inference" data-dashed="agent:sandbox">

<div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>Agent · solve the task</b><code>responses_api_agents/</code><small>Model ↔ tool loop</small></div>
<div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>Model · forward requests</b><code>responses_api_models/</code><small>Shared protocol and linked calls</small></div>

</div><div class="diagram-legend"><span><i></i>Call / create</span><span><i class="dashed"></i>Borrowed access</span></div><figcaption>This diagram uses the SWE-Pro setup covered later. Environments do not all need a sandbox. Shared protocol, HTTP, and lifecycle code lives in <code>nemo_gym/</code>. Environment and Agent both coordinate work, at different levels: Environment manages the steps of an episode; Agent manages the model and tool loop.</figcaption></figure>
<!-- SLOT: contract -->
<figure class="diagram" id="diagram-contract" aria-labelledby="diagram-contract-title"><div class="diagram-head"><div><span class="diagram-eyebrow">02 / A TASK IN AN ENVELOPE</span><h3 id="diagram-contract-title">One task envelope, two identities</h3></div><p class="diagram-note">Separate “which task?” from “which attempt?” and the JSON becomes easier to read.</p></div><div class="envelope-layout"><div class="envelope"><div class="envelope-title"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg>SingleAgentTurnRequest</div><div class="identity-strip"><b>episode_id</b><br><code>rollout_id + attempt</code><br>One execution attempt for this sampled rollout</div><div class="nested-task"><strong>task</strong><div class="message-parts"><div class="message-part"><b>task_id</b><code>taskset + task_id</code> · Which task, in which task set</div><div class="message-part"><b>task_input.responses_create_params</b>Model input for the Agent</div><div class="message-part"><b>task_input.task_data</b>Task and scoring data for Resources</div></div></div></div><div class="big-diagram-arrow" aria-hidden="true">→</div><div class="outcome-stack"><div class="d-node mint"><svg class="d-icon" aria-hidden="true"><use href="#icon-check"/></svg><b>result</b><small>Score + trajectory / observations</small><code>reward · response · …</code></div><span class="or-divider">Exactly one is non-null in the response</span><div class="d-node peach"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>failure</b><small>Reason, stage, and available partial results</small><code>terminal · failure_reason</code></div></div></div><figcaption>The response also contains <code>episode_id</code> and <code>task_id</code>. Even when result is present, check whether verification completed. A result does not always contain a valid score.</figcaption></figure>
<!-- SLOT: serving -->
<figure class="diagram" id="diagram-serving" aria-labelledby="diagram-serving-title"><div class="diagram-head"><div><span class="diagram-eyebrow">03 / FOLLOW ONE MODEL REQUEST</span><h3 id="diagram-serving-title">Zoom in on one model request</h3></div><p class="diagram-note">This diagram follows only the model request. An HTTP service receives requests; it is not the GPU itself.</p></div><div class="diagram-map mini-map" data-edges="agent:proxy,proxy:inference,inference:reply"><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>Hermes</b><small>“What should I do next?”</small><code>HTTP request</code></div><div class="d-node lavender" data-node="proxy"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>Gym Model Server</b><small>Convert the format and forward upstream</small><code>Protocol adapter</code></div><div class="d-node sky" data-node="inference"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>Inference endpoint</b><small>Queue, batch, run the model</small><code>Weights live here</code></div><div class="d-node butter" data-node="reply"><svg class="d-icon" aria-hidden="true"><use href="#icon-book"/></svg><b>Generate the next step</b><small>Text / tool call</small><code>Return along the same path</code></div></div><figcaption>The model proxy and inference engine can run on different machines. <code>localhost</code> refers to the current process’s network environment. Inside a sandbox, it usually does not refer to your control machine.</figcaption></figure>
<!-- SLOT: await -->
<figure class="diagram" id="diagram-await" aria-labelledby="diagram-await-title"><div class="diagram-head"><div><span class="diagram-eyebrow">04 / THE LITTLE AWAIT RELAY</span><h3 id="diagram-await-title">await: I’ll wait; you can keep going</h3></div><p class="diagram-note">The helpers represent turns on the event loop. This is an analogy; it does not add CPU cores.</p></div><div class="await-comic"><div class="comic-frame"><span class="comic-number">01 · Send a request</span><h4>A does some local work first</h4><div class="comic-scene" aria-hidden="true"><div class="comic-worker"><span>A</span></div><span class="comic-arrow">→</span><div class="comic-cloud">Network</div></div><p>After sending the request, A has nothing more to do until the I/O completes.</p></div><div class="comic-frame"><span class="comic-number">02 · Yield control</span><h4>A waits; B can move forward</h4><div class="comic-scene" aria-hidden="true"><div class="comic-cloud">A waits</div><div class="comic-worker"><span>B</span></div></div><p><code>await</code> on an I/O operation that can suspend gives the event loop a chance to run other coroutines.</p></div><div class="comic-frame"><span class="comic-number">03 · Resume</span><h4>The reply arrives; A continues</h4><div class="comic-scene" aria-hidden="true"><div class="comic-cloud">Reply</div><span class="comic-arrow">→</span><div class="comic-worker"><span>A</span></div></div><p>To overlap work, schedule tasks first. If a loop creates one coroutine and immediately uses <code>await</code> on it, the next call has not started yet.</p></div></div><figcaption>Synchronous blocking calls occupy the event loop. CPU-heavy work does not run in parallel just because it uses <code>async def</code>. The timeline below compares these cases.</figcaption></figure>
<!-- SLOT: tiny -->
<figure class="diagram" id="diagram-tiny" aria-labelledby="diagram-tiny-title"><div class="diagram-head"><div><span class="diagram-eyebrow">01 / THE SMALL TOOL LOOP</span><h3 id="diagram-tiny-title">The model proposes; the tool acts</h3></div><p class="diagram-note">Understand this small loop first. Then place it inside a complete episode.</p></div><div class="diagram-map tiny-loop" data-edges="agent:model,model:agent,agent:tool,tool:agent"><div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>Model</b><small>“Call get_weather”</small><code>function_call</code></div><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>SimpleAgent</b><small>Parse the call and dispatch the tool<br>Add the observation to history</small><code>Match the call_id</code></div><div class="d-node mint" data-node="tool"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg><b>Resources tool</b><small>Run get_weather<br>Return the observation to the Agent</small><code>HTTP tool response</code></div></div><figcaption>The Agent wraps the tool’s return value in a <code>function_call_output</code> and adds it to the model’s context. Think of the tool schema as a menu and the Resources function as the kitchen. Naming a tool and its arguments does not execute it. This weather example always returns cold. The code and verifier appear below.</figcaption></figure>
<!-- SLOT: journey -->
<figure class="diagram" id="diagram-journey" aria-labelledby="diagram-journey-title"><div class="diagram-head"><div><span class="diagram-eyebrow">10 / WHERE ARE WE NOW?</span><h3 id="diagram-journey-title">Whose turn is it?</h3></div><p class="diagram-note">Choose a step below to highlight its main component. Other components may still be busy; the highlight only shows the focus of this step.</p></div><div class="diagram-map journey-map" data-edges="client:env,env:agent,env:resources,agent:model,resources:sandbox,agent:sandbox,resources:verifier" data-dashed="agent:sandbox">
<div class="d-node butter" data-node="client"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>Client / input</b><small>Tasks, identities, and saved results</small></div><div class="d-node lavender" data-node="env"><svg class="d-icon" aria-hidden="true"><use href="#icon-bean"/></svg><b>Environment</b><small>single_agent_turn</small></div><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>Hermes Agent</b><small>Session + model / tool loop</small></div><div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>Model path</b><small>Gym proxy → inference endpoint</small></div><div class="d-node mint" data-node="resources"><svg class="d-icon" aria-hidden="true"><use href="#icon-key"/></svg><b>Resources</b><small>Owns the task sandbox</small></div><div class="d-node mint" data-node="sandbox"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg><b>Workspace A</b><small>The model changes /app through tools</small></div><div class="d-node butter" data-node="verifier"><svg class="d-icon" aria-hidden="true"><use href="#icon-check"/></svg><b>Scoring workspace B</b><small>Clean environment + candidate patch + tests</small></div></div><div class="controls diagram-step-controls" role="group" aria-label="Change diagram step"><button data-journey-prev disabled>← Previous step</button><span class="small" id="journey-step-count"></span><button data-journey-next>Next step →</button></div><figcaption id="journey-focus-caption">Start with the input, then follow the steps below.</figcaption></figure>
<!-- SLOT: verdict -->
<figure class="diagram" id="diagram-verdict" aria-labelledby="diagram-verdict-title"><div class="diagram-head"><div><span class="diagram-eyebrow">11 / TWO SEPARATE RECEIPTS</span><h3 id="diagram-verdict-title">One run, two separate records</h3></div><p class="diagram-note">Both records below come from the same real run. Keep their outcomes separate instead of reducing them to one “success” or “failure.”</p></div><div class="receipt-fork"><div class="receipt"><div class="receipt-head"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg>AGENT RECORD</div><h4>incomplete</h4><p>Reached the 20-turn limit<br>Final summary request: HTTP 422<br>Repository changes were saved</p><span class="receipt-stamp">The response did not finish normally</span></div><div class="receipt"><div class="receipt-head"><svg class="d-icon" aria-hidden="true"><use href="#icon-check"/></svg>VERIFIER RECORD</div><h4>18 / 18 passed</h4><p>Candidate patch: 11,273 bytes<br>evaluation_completed = true<br>reward = 1</p><span class="receipt-stamp">The actual patch passed the required tests</span></div></div><figcaption>Scoring uses the actual diff in the task sandbox, not the final answer. Both records can therefore be true. Neither measures accuracy across the full benchmark.</figcaption></figure>
<!-- SLOT: lease -->
<figure class="diagram" id="diagram-lease" aria-labelledby="diagram-lease-title"><div class="diagram-head"><div><span class="diagram-eyebrow">12 / BORROW THE KEY, KEEP THE ROOM</span><h3 id="diagram-lease-title">Return the key; keep the workspace</h3></div><p class="diagram-note">This analogy describes the borrowed-sandbox path. Owning a sandbox and connecting to it are different operations.</p></div><div class="lease-layout"><div class="lease-home"><svg viewBox="0 0 170 150" aria-hidden="true"><path d="m15 61 68-48 70 48" fill="#e4d7f4" stroke="#89739f" stroke-width="2.3" stroke-linejoin="round"/><path d="M28 54v81h111V54" fill="#fffaf0" stroke="#89739f" stroke-width="2.3"/><rect x="69" y="87" width="29" height="48" rx="8" fill="#d7e9df" stroke="#779887" stroke-width="2"/><rect x="43" y="69" width="15" height="18" rx="4" fill="#dceaf4"/><rect x="112" y="69" width="15" height="18" rx="4" fill="#dceaf4"/><circle cx="88" cy="111" r="2" fill="#71867c"/><circle cx="141" cy="111" r="10" fill="#ffedb4" stroke="#bda05b" stroke-width="2"/><path d="m133 119-18 19m7-7 4 4" stroke="#bda05b" stroke-width="3" stroke-linecap="round"/><path d="m12 125 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#bea8d2"/></svg><p><strong>Resources owns workspace A</strong><br>Hermes borrows it to edit files. When it returns the key, the final changes must stay available for the verifier.</p></div><ol class="lease-lane"><li><b>Resources: prepare the workspace</b><small>seed → create A and issue SandboxAccess</small></li><li><b>Hermes: borrow it and work</b><small>connect → activation → edit /app</small></li><li><b>Agent close: stop its own processes first</b><small>Confirm cleanup and disconnect the borrowed connection; keep A</small></li><li><b>Resources: extract the patch, then stop A</b><small>Apply the patch in clean workspace B, score it, then clean up B</small></li><li><b>Finally, close the Resources session</b><small>Failure paths also have registered cleanup and a separate time budget</small></li></ol></div><figcaption>The order matters. If the Agent destroys A too soon, Resources cannot reliably read the final diff. An HTTP response also does not prove that background processes and containers have been cleaned up.</figcaption></figure>
<!-- SLOT: wiring -->
<figure class="diagram" id="diagram-wiring" aria-labelledby="diagram-wiring-title"><div class="diagram-head"><div><span class="diagram-eyebrow">13 / YAML IS THE WIRING</span><h3 id="diagram-wiring-title">Read YAML as connections between components</h3></div><p class="diagram-note"><code>name</code> identifies an instance; the implementation directory selects the code. These names match this chapter’s configuration.</p></div><div class="diagram-map config-map" data-edges="env:resources,env:agent,agent:model,resources:provider,model:inference"><div class="d-node lavender" data-node="env"><svg class="d-icon" aria-hidden="true"><use href="#icon-bean"/></svg><b>single_agent_turn</b><small>resources_server / agent_server</small></div><div class="d-node mint" data-node="resources"><svg class="d-icon" aria-hidden="true"><use href="#icon-key"/></svg><b>swebench_pro_<br>resources_server</b><small>Manage task state and scoring</small></div><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>hermes_agent</b><small>model_server.name</small><code>enabled_toolsets: [terminal]</code></div><div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>policy_model</b><small>Gym model proxy instance</small></div><div class="d-node mint" data-node="provider"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg><b>sandbox provider</b><small>OpenSandbox implementation →<br>Deployed OpenSandbox server</small></div><div class="d-node sky" data-node="inference"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>Inference endpoint</b><small>base URL + served model ID</small></div></div><figcaption>This diagram matches the native single-task example in Chapter 13. The provider implements create / connect / exec / stop. The OpenSandbox server it connects to is the remote service. After configuring the connections, send a task to the Environment in the required typed format.</figcaption></figure>
<!-- SLOT: compare -->
<figure class="diagram" id="diagram-compare" aria-labelledby="diagram-compare-title"><div class="diagram-head"><div><span class="diagram-eyebrow">14 / SAME QUESTION, DIFFERENT ORGANIZATION</span><h3 id="diagram-compare-title">Gym and Harbor: how do they organize a task?</h3></div><p class="diagram-note">This compares structure, not speed or quality. Available features depend on the version and adapter.</p></div><div class="comparison-lanes"><div class="comparison-lane"><div class="comparison-title"><svg class="d-icon" aria-hidden="true"><use href="#icon-bean"/></svg>Gym’s native composition</div><div class="comparison-chain"><div class="d-node butter"><b>Task / Episode</b><small>Task + this attempt</small></div><span class="join" aria-hidden="true">→</span><div class="d-node lavender"><b>Environment</b><small>Shared lifecycle</small></div><span class="join" aria-hidden="true">→</span><div class="part-stack"><span>Agent · actions</span><span>Resources · state / scoring</span><span>Model · inference interface</span></div></div><p>Combine independently replaceable services. Manage their protocols, sessions, network calls, and failure boundaries.</p></div><div class="comparison-lane"><div class="comparison-title"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg>Harbor’s structure</div><div class="comparison-chain"><div class="d-node butter"><b>Job</b><small>A set of task attempts</small></div><span class="join" aria-hidden="true">→</span><div class="d-node mint"><b>Trial</b><small>One attempt at a Task</small></div><span class="join" aria-hidden="true">→</span><div class="part-stack"><span>Agent · harness</span><span>Environment · execution</span><span>Verifier · scoring</span></div></div><p>Organize evaluation around task and trial artifacts. Check the adapters, setup, and meaning of each result field.</p></div></div><figcaption>The repo already has a Gym + Harbor bridge, so the two can work together. The better fit depends on your existing tasks, model interface, training needs, and maintenance cost. The comparison below covers each point.</figcaption></figure>

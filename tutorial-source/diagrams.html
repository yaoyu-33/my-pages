<!-- SLOT: team -->
<figure class="diagram" id="diagram-team" aria-labelledby="diagram-team-title"><div class="diagram-head"><div><span class="diagram-eyebrow">00 / MEET THE TEAM</span><h3 id="diagram-team-title">先认小伙伴，再看文件夹</h3></div><p class="diagram-note">方框是角色，箭头是调用。先记住这几个名字，后面每一章都会用到；英文名保留原样，方便在代码里搜索。</p></div>
<div class="diagram-map team-map" data-edges="client:env,env:resources,env:agent,agent:model,resources:sandbox,agent:sandbox,model:inference" data-dashed="agent:sandbox">
<div class="d-node butter" data-node="client"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>带着题目来</b><small>Client / Collector</small><code>task + episode</code></div>
<div class="d-node lavender" data-node="env"><svg class="d-icon" aria-hidden="true"><use href="#icon-bean"/></svg><b>Environment · 排流程</b><code>environment_servers/</code><small>准备 → 行动 → 评分 → 清理</small></div>
<div class="d-node mint" data-node="resources"><svg class="d-icon" aria-hidden="true"><use href="#icon-key"/></svg><b>Resources · 管任务</b><code>resources_servers/</code><small>状态、工具与 verifier</small></div>
<div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>Agent · 想办法</b><code>responses_api_agents/</code><small>模型 ↔ 工具循环</small></div>
<div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>Model · 转接请求</b><code>responses_api_models/</code><small>统一协议与调用关联</small></div>
<div class="d-node mint" data-node="sandbox"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg><b>Task sandbox</b><small>这个案例里的临时工作间</small><span class="node-tag">Resources 拥有 · Agent 借用</span></div>
<div class="d-node sky" data-node="inference"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>真正的推理服务</b><small>持有模型权重，执行推理</small></div>
</div><div class="diagram-legend"><span><i></i>调用 / 创建</span><span><i class="dashed"></i>借用访问</span></div><figcaption>图中用的是后面 SWE-Pro 案例的组合；并不是每个环境都需要 sandbox。所有组件共用的协议、HTTP 和生命周期代码在 <code>nemo_gym/</code>。Environment 和 Agent 都负责编排，但层次不同：Environment 管一次 episode 的步骤，Agent 管模型与工具的循环。</figcaption></figure>
<!-- SLOT: contract -->
<figure class="diagram" id="diagram-contract" aria-labelledby="diagram-contract-title"><div class="diagram-head"><div><span class="diagram-eyebrow">02 / A TASK IN AN ENVELOPE</span><h3 id="diagram-contract-title">一封任务信，装着两种身份</h3></div><p class="diagram-note">先分清“哪道题”与“第几次尝试”，再读 JSON 就轻松多啦。</p></div><div class="envelope-layout"><div class="envelope"><div class="envelope-title"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg>SingleAgentTurnRequest</div><div class="identity-strip"><b>episode_id</b><br><code>rollout_id + attempt</code><br>这次采样中的一次实际执行</div><div class="nested-task"><strong>task</strong><div class="message-parts"><div class="message-part"><b>task_id</b><code>taskset + task_id</code> · 哪个集合里的哪道题</div><div class="message-part"><b>task_input.responses_create_params</b>给 Agent 的模型输入</div><div class="message-part"><b>task_input.task_data</b>给 Resources 的任务与评分数据</div></div></div></div><div class="big-diagram-arrow" aria-hidden="true">→</div><div class="outcome-stack"><div class="d-node mint"><svg class="d-icon" aria-hidden="true"><use href="#icon-check"/></svg><b>result</b><small>评分结果 + 轨迹 / 观察</small><code>reward · response · …</code></div><span class="or-divider">返回时，两者中只有一个非空</span><div class="d-node peach"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>failure</b><small>原因、阶段、可用的部分结果</small><code>terminal · failure_reason</code></div></div></div><figcaption>返回的响应体（envelope）还带着 <code>episode_id</code> 和 <code>task_id</code>。即使返回了 result，也要检查 verifier 是否真的完成；“有结果”不等于“拿到了有效分数”。</figcaption></figure>
<!-- SLOT: serving -->
<figure class="diagram" id="diagram-serving" aria-labelledby="diagram-serving-title"><div class="diagram-head"><div><span class="diagram-eyebrow">03 / FOLLOW ONE MODEL REQUEST</span><h3 id="diagram-serving-title">把“问一次模型”放大看</h3></div><p class="diagram-note">这里只放大“问模型”这一段。HTTP 服务是负责接请求的角色，不等于 GPU。</p></div><div class="diagram-map mini-map" data-edges="agent:proxy,proxy:inference,inference:reply"><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>Hermes</b><small>“下一步做什么？”</small><code>HTTP request</code></div><div class="d-node lavender" data-node="proxy"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>Gym Model Server</b><small>整理格式，转给上游</small><code>协议适配</code></div><div class="d-node sky" data-node="inference"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>推理 endpoint</b><small>排队、batch、运行模型</small><code>权重在这里</code></div><div class="d-node butter" data-node="reply"><svg class="d-icon" aria-hidden="true"><use href="#icon-book"/></svg><b>生成下一步</b><small>文字 / tool call</small><code>再沿原路返回</code></div></div><figcaption>模型代理和推理引擎可以部署在不同的机器上。<code>localhost</code> 指当前进程所在的网络环境；在 sandbox 里，它通常不是你的控制侧机器。</figcaption></figure>
<!-- SLOT: await -->
<figure class="diagram" id="diagram-await" aria-labelledby="diagram-await-title"><div class="diagram-head"><div><span class="diagram-eyebrow">04 / THE LITTLE AWAIT RELAY</span><h3 id="diagram-await-title">await：我去等回信，你们先忙</h3></div><p class="diagram-note">图里的“小助手”代表 event loop 分配的执行机会。这只是类比，并没有多出几个 CPU。</p></div><div class="await-comic"><div class="comic-frame"><span class="comic-number">01 · 发出请求</span><h4>A 先做一点本地工作</h4><div class="comic-scene" aria-hidden="true"><div class="comic-worker"><span>A</span></div><span class="comic-arrow">→</span><div class="comic-cloud">网络</div></div><p>请求发出后，A 暂时没有可做的事。它需要等待 I/O 完成。</p></div><div class="comic-frame"><span class="comic-number">02 · 让出执行机会</span><h4>A 等待，B 可以向前走</h4><div class="comic-scene" aria-hidden="true"><div class="comic-cloud">A 等待</div><div class="comic-worker"><span>B</span></div></div><p><code>await</code> 一个可挂起的 I/O 操作，让 event loop 有机会调度别的协程。</p></div><div class="comic-frame"><span class="comic-number">03 · 回来继续</span><h4>回信到了，A 再接着做</h4><div class="comic-scene" aria-hidden="true"><div class="comic-cloud">回信</div><span class="comic-arrow">→</span><div class="comic-worker"><span>A</span></div></div><p>需要先创建并发任务。只在 for 循环里逐个 <code>await</code>，下一题还没有开始。</p></div></div><figcaption>同步阻塞调用会占住 event loop；CPU 密集的工作也不会因为写成 <code>async def</code> 就自动并行。下面的时间线可以直接比较这几种情况。</figcaption></figure>
<!-- SLOT: tiny -->
<figure class="diagram" id="diagram-tiny" aria-labelledby="diagram-tiny-title"><div class="diagram-head"><div><span class="diagram-eyebrow">01 / THE SMALL TOOL LOOP</span><h3 id="diagram-tiny-title">模型提主意，工具才去做</h3></div><p class="diagram-note">先看清这个小循环，之后再把它放进完整的 episode。</p></div><div class="diagram-map tiny-loop" data-edges="agent:model,model:agent,agent:tool,tool:agent"><div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>Model</b><small>“调用 get_weather”</small><code>function_call</code></div><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>SimpleAgent</b><small>解析调用，派发工具<br>把观察结果加入 history</small><code>call_id 要对上</code></div><div class="d-node mint" data-node="tool"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg><b>Resources 工具</b><small>真正执行 get_weather<br>返回观察给 Agent</small><code>HTTP tool response</code></div></div><figcaption>Agent 把工具的返回值包装成 <code>function_call_output</code>，放回模型的上下文。工具 schema 像“菜单”，Resources 里的函数才是“厨房”：模型说出工具名和参数，并不等于工具已经执行。这个天气例子总是返回 cold；具体代码和 verifier 见下文。</figcaption></figure>
<!-- SLOT: journey -->
<figure class="diagram" id="diagram-journey" aria-labelledby="diagram-journey-title"><div class="diagram-head"><div><span class="diagram-eyebrow">10 / WHERE ARE WE NOW?</span><h3 id="diagram-journey-title">这一站，轮到谁啦？</h3></div><p class="diagram-note">点下面的流程步骤，这张地图会同步高亮当前的组件。高亮只表示这一步的重点，其他组件不一定空闲。</p></div><div class="diagram-map journey-map" data-edges="client:env,env:agent,env:resources,agent:model,resources:sandbox,agent:sandbox,resources:verifier" data-dashed="agent:sandbox">
<div class="d-node butter" data-node="client"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>Client / 输入</b><small>任务、身份与保存结果</small></div><div class="d-node lavender" data-node="env"><svg class="d-icon" aria-hidden="true"><use href="#icon-bean"/></svg><b>Environment</b><small>single_agent_turn</small></div><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>Hermes Agent</b><small>session + 模型 / 工具循环</small></div><div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>Model 路径</b><small>Gym proxy → 推理 endpoint</small></div><div class="d-node mint" data-node="resources"><svg class="d-icon" aria-hidden="true"><use href="#icon-key"/></svg><b>Resources</b><small>任务 sandbox 的所有者</small></div><div class="d-node mint" data-node="sandbox"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg><b>工作间 A</b><small>模型通过工具修改 /app</small></div><div class="d-node butter" data-node="verifier"><svg class="d-icon" aria-hidden="true"><use href="#icon-check"/></svg><b>评分间 B</b><small>干净环境 + 候选 patch + 测试</small></div></div><div class="controls diagram-step-controls" role="group" aria-label="切换图解步骤"><button data-journey-prev disabled>← 上一站</button><span class="small" id="journey-step-count"></span><button data-journey-next>下一站 →</button></div><figcaption id="journey-focus-caption">先从输入开始，再跟着下方步骤走一遍。</figcaption></figure>
<!-- SLOT: verdict -->
<figure class="diagram" id="diagram-verdict" aria-labelledby="diagram-verdict-title"><div class="diagram-head"><div><span class="diagram-eyebrow">11 / TWO SEPARATE RECORDS</span><h3 id="diagram-verdict-title">一次运行，留下两份不同的记录</h3></div><p class="diagram-note">下面两份记录来自同一次真实运行。不要把它们合并成一个笼统的“成功 / 失败”。</p></div><div class="receipt-fork"><div class="receipt"><div class="receipt-head"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg>AGENT 记录</div><h4>incomplete</h4><p>达到 20 轮上限<br>最终摘要请求：HTTP 422<br>仓库中的修改已经保存</p><span class="receipt-stamp">回答没有自然完成</span></div><div class="receipt"><div class="receipt-head"><svg class="d-icon" aria-hidden="true"><use href="#icon-check"/></svg>VERIFIER 记录</div><h4>18 / 18 通过</h4><p>候选 patch：11,273 bytes<br>evaluation_completed = true<br>reward = 1</p><span class="receipt-stamp">实际补丁通过指定测试</span></div></div><figcaption>评分看的是任务 sandbox 里实际的 diff，不看最终回答怎么说。所以这两份记录可以同时成立；但它们都不能代替完整 benchmark 的准确率统计。</figcaption></figure>
<!-- SLOT: lease -->
<figure class="diagram" id="diagram-lease" aria-labelledby="diagram-lease-title"><div class="diagram-head"><div><span class="diagram-eyebrow">12 / BORROW THE KEY, KEEP THE ROOM</span><h3 id="diagram-lease-title">借钥匙，可以；提前退房，不行</h3></div><p class="diagram-note">这个类比对应“借用 sandbox”的路径：拥有一个 sandbox 和连接到它，是两件事。</p></div><div class="lease-layout"><div class="lease-home"><svg viewBox="0 0 170 150" aria-hidden="true"><path d="m15 61 68-48 70 48" fill="#e4d7f4" stroke="#89739f" stroke-width="2.3" stroke-linejoin="round"/><path d="M28 54v81h111V54" fill="#fffaf0" stroke="#89739f" stroke-width="2.3"/><rect x="69" y="87" width="29" height="48" rx="8" fill="#d7e9df" stroke="#779887" stroke-width="2"/><rect x="43" y="69" width="15" height="18" rx="4" fill="#dceaf4"/><rect x="112" y="69" width="15" height="18" rx="4" fill="#dceaf4"/><circle cx="88" cy="111" r="2" fill="#71867c"/><circle cx="141" cy="111" r="10" fill="#ffedb4" stroke="#bda05b" stroke-width="2"/><path d="m133 119-18 19m7-7 4 4" stroke="#bda05b" stroke-width="3" stroke-linecap="round"/><path d="m12 125 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#bea8d2"/></svg><p><strong>Resources 拥有工作间 A</strong><br>Hermes 借用它操作文件。还钥匙时，工作间里最后的修改要留给 verifier。</p></div><ol class="lease-lane"><li><b>Resources：准备工作间</b><small>seed → 创建 A，发出 SandboxAccess</small></li><li><b>Hermes：借用并完成工作</b><small>connect → activation → 修改 /app</small></li><li><b>Agent close：先停自己的进程</b><small>确认 cleanup，借用路径 disconnect；A 仍保留</small></li><li><b>Resources：取出 patch，再 stop A</b><small>然后在干净的 B 中应用 patch、评分并回收</small></li><li><b>最后关闭 Resources session</b><small>异常路径也有注册的 cleanup 与独立预算</small></li></ol></div><figcaption>为什么要按这个顺序：如果 Agent 提前销毁了 A，Resources 就无法可靠地读取最终的 diff。另外，HTTP 请求返回了，也不能证明后台进程和容器都已清理干净。</figcaption></figure>
<!-- SLOT: wiring -->
<figure class="diagram" id="diagram-wiring" aria-labelledby="diagram-wiring-title"><div class="diagram-head"><div><span class="diagram-eyebrow">13 / YAML IS THE WIRING</span><h3 id="diagram-wiring-title">把 YAML 看成几根连接线</h3></div><p class="diagram-note"><code>name</code> 找实例；实现目录选代码。下面的名字直接对应本章配置。</p></div><div class="diagram-map config-map" data-edges="env:resources,env:agent,agent:model,resources:provider,model:inference"><div class="d-node lavender" data-node="env"><svg class="d-icon" aria-hidden="true"><use href="#icon-bean"/></svg><b>single_agent_turn</b><small>resources_server / agent_server</small></div><div class="d-node mint" data-node="resources"><svg class="d-icon" aria-hidden="true"><use href="#icon-key"/></svg><b>swebench_pro_<br>resources_server</b><small>管理任务与评分</small></div><div class="d-node peach" data-node="agent"><svg class="d-icon" aria-hidden="true"><use href="#icon-robot"/></svg><b>hermes_agent</b><small>model_server.name</small><code>enabled_toolsets: [terminal]</code></div><div class="d-node sky" data-node="model"><svg class="d-icon" aria-hidden="true"><use href="#icon-envelope"/></svg><b>policy_model</b><small>Gym 的模型代理实例</small></div><div class="d-node mint" data-node="provider"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg><b>sandbox provider</b><small>OpenSandbox 实现 →<br>已部署的 OpenSandbox server</small></div><div class="d-node sky" data-node="inference"><svg class="d-icon" aria-hidden="true"><use href="#icon-chip"/></svg><b>推理 endpoint</b><small>base URL + served model ID</small></div></div><figcaption>本图对应第 13 章的原生单题示例。provider 是提供 create / connect / exec / stop 的实现，它连接的 OpenSandbox server 才是远程服务。配置连好之后，还需要向 Environment 发送符合 typed 格式的任务。</figcaption></figure>
<!-- SLOT: compare -->
<figure class="diagram" id="diagram-compare" aria-labelledby="diagram-compare-title"><div class="diagram-head"><div><span class="diagram-eyebrow">14 / SAME QUESTION, DIFFERENT ORGANIZATION</span><h3 id="diagram-compare-title">Gym 和 Harbor：怎么把一题组织起来？</h3></div><p class="diagram-note">这张图比较的是组织方式，不是速度或质量排名。具体功能还要看版本和适配器。</p></div><div class="comparison-lanes"><div class="comparison-lane"><div class="comparison-title"><svg class="d-icon" aria-hidden="true"><use href="#icon-bean"/></svg>Gym 原生组合</div><div class="comparison-chain"><div class="d-node butter"><b>Task / Episode</b><small>题目 + 这次尝试</small></div><span class="join" aria-hidden="true">→</span><div class="d-node lavender"><b>Environment</b><small>统一生命周期</small></div><span class="join" aria-hidden="true">→</span><div class="part-stack"><span>Agent · 行动</span><span>Resources · 状态 / 评分</span><span>Model · 推理接口</span></div></div><p>组合可独立替换的服务；管理协议、session、网络与失败边界。</p></div><div class="comparison-lane"><div class="comparison-title"><svg class="d-icon" aria-hidden="true"><use href="#icon-house"/></svg>Harbor 的组织方式</div><div class="comparison-chain"><div class="d-node butter"><b>Job</b><small>一组任务尝试</small></div><span class="join" aria-hidden="true">→</span><div class="d-node mint"><b>Trial</b><small>尝试一个 Task</small></div><span class="join" aria-hidden="true">→</span><div class="part-stack"><span>Agent · harness</span><span>Environment · 执行环境</span><span>Verifier · 评分</span></div></div><p>围绕 task / trial 的输出文件组织评测；适配器、安装方式和结果含义仍需核对。</p></div></div><figcaption>仓库里已经有 Gym + Harbor 的 bridge，两者也可以组合使用。哪种更适合你，取决于已有的任务资产、模型接口、训练需求和维护成本；下面逐项比较。</figcaption></figure>
